<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Caculator</h1>
       
        <div class="calculator">
            <input type="text"  name="screen" id="screen" >
            <table>
                <tr>
                    <td><button class="btn" id="clear">C</button></td>
                    <td><button class="btn" id="backspace">←</button></td>
                    <td><button class="btn" id="divide">/</button></td>
                    <td><button class="btn" id="multiply">x</button></td>
                </tr>
                
                <tr>
                    <td><button class="btn" id="seven">7</button></td>
                    <td><button class="btn" id="eight">8</button></td>
                    <td><button class="btn" id="nine">9</button></td>
                    <td><button class="btn" id="subtract">-</button></td>
                </tr>
                <tr>
                    <td><button class="btn" id="four">4</button></td>
                    <td><button class="btn" id="five">5</button></td>
                    <td><button class="btn" id="six">6</button></td>
                    <td><button class="btn" id="add">+</button></td>
                </tr>
                <tr>
                    <td><button class="btn" id="one">1</button></td>
                    <td><button class="btn" id="two">2</button></td>
                    <td><button class="btn" id="three">3</button></td>
                    <td><button class="btn equal" id="equal">=</button></td>
                </tr>
                <tr>
                    <td><button class="btn zero" id="zero">0</button></td>
                    <td><button class="btn" id="decimal">.</button></td> 
                   <td><button class="btn" id="bracket1">(</button></td>
                   <td><button class="btn" id="bracket2">)</button></td>
               </tr>
            </table>
        </div>
    </div>

<script src="app.js"></script>
</body>
</html>
